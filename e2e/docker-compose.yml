name: speck5g-e2e

# The capture bench of test-vectors/capture/setup with our core in place of
# Open5GS: eUPF v0.7.2, a data network, UERANSIM gNB and UE (image built by the
# capture's flake), and the core (kernel + edge, built by run.sh). Addresses,
# subscriber and keys are the capture's, so the configs are mounted from there.

networks:
  core:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-5ge2e
    ipam:
      config:
        - subnet: 10.33.0.0/24

services:
  core:
    image: speck5g-core:e2e
    networks: {core: {ipv4_address: 10.33.0.11}}
    volumes:
      - ./edge.toml:/edge.toml:ro
    command: ["--config", "/edge.toml"]

  eupf:
    image: ghcr.io/edgecomllc/eupf:0.7.2@sha256:01ad44889ce546ae0720cdc9e648889e9a653d40a20a1867d6751ae6cbb6cb08
    privileged: true
    networks: {core: {ipv4_address: 10.33.0.20}}
    volumes:
      - ../test-vectors/capture/setup/eupf/config.yml:/config.yml:ro
    command: ["--config", "/config.yml"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"

  dn:
    image: nicolaka/netshoot:v0.14@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2
    networks: {core: {ipv4_address: 10.33.0.40}}
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route add 10.45.0.0/16 via 10.33.0.20 && sleep infinity"]

  gnb:
    image: speck5g-ueransim:3.3.0
    networks: {core: {ipv4_address: 10.33.0.30}}
    volumes: [../test-vectors/capture/setup/ueransim:/cfg:ro]
    entrypoint: ["nr-gnb", "-c", "/cfg/gnb.yaml"]

  ue:
    image: speck5g-ueransim:3.3.0
    networks: {core: {ipv4_address: 10.33.0.31}}
    volumes: [../test-vectors/capture/setup/ueransim:/cfg:ro]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    entrypoint: ["nr-ue", "-c", "/cfg/ue.yaml"]
